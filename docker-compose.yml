version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wch-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wch_core}
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wch_core}
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    container_name: wch-redis
    ports:
      - 127.0.0.1:6381:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-api-gateway
    command:
      - api-gateway
    environment:
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
    ports:
      - 8000:8000
    depends_on:
      auth-service:
        condition: service_started
      ai-gateway:
        condition: service_started
      umkm-accounting:
        condition: service_started
      campaign-api:
        condition: service_started
    restart: unless-stopped
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-auth-service
    command:
      - auth-service
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-ai-gateway
    command:
      - ai-gateway
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL}
      - MINIMAX_MODEL=${MINIMAX_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  umkm-accounting:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-accounting
    command:
      - umkm-accounting
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  umkm-business:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-business
    command:
      - umkm-business
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  n8n-main:
    image: n8nio/n8n:latest
    container_name: wch-n8n-main
    restart: always
    environment:
      # Queue Mode
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=2
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-wch_core}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-postgres}
      # Webhook & UI
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PATH=/api/superadmin/n8n/
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n-main:5678/}
      - GENERIC_TIMEZONE=Asia/Jakarta
      # Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-change_me_in_env}
      # Performance
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_METRICS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_CONCURRENCY_PRODUCTION_LIMIT:-20}
      # Telegram
      - OWNER_TELEGRAM_CHAT_ID=${OWNER_TELEGRAM_CHAT_ID:-}
    entrypoint:
      - /bin/sh
      - /infra/n8n/init.sh
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows
      - ./infra/n8n/init.sh:/infra/n8n/init.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: wch-n8n-worker
    restart: always
    command: worker
    environment:
      # Queue Mode
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=2
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-wch_core}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-postgres}
      # Performance
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_WORKER_CONCURRENCY:-10}
      - GENERIC_TIMEZONE=Asia/Jakarta
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      n8n-main:
        condition: service_healthy
      redis:
        condition: service_healthy
  umkm-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-chatbot
    command:
      - umkm-chatbot
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
      - REDIS_HOST=redis
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n-main:5678/}
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  campaign-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-campaign-api
    command:
      - campaign-api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  wa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-wa-gateway
    command:
      - wa-gateway
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n-main:5678/}
    ports:
      - "8202:8202"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-billing-service
    command:
      - billing-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - XENDIT_API_KEY=${XENDIT_API_KEY}
      - XENDIT_WEBHOOK_TOKEN=${XENDIT_WEBHOOK_TOKEN}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-notification-service
    command:
      - notification-service
    environment:
      - APP_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "8005:8005"
    depends_on:
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  subscription-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-subscription-worker
    command:
      - subscription-worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - FREEZE_CHECK_INTERVAL=${FREEZE_CHECK_INTERVAL:-1h}
      - GRACE_PERIOD_HOURS=${GRACE_PERIOD_HOURS:-0}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  chatwoot-redis:
    image: redis:7-alpine
    container_name: wch-chatwoot-redis
    command: redis-server --appendonly yes
    volumes:
      - chatwoot_redis_data:/data
    restart: unless-stopped
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: wch-chatwoot
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_lengthy_secure_hex}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
      - RAILS_LOG_TO_STDOUT=true
      - DEFAULT_LOCALE=id
    command: bundle exec rails s -b 0.0.0.0 -p 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    restart: unless-stopped
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: wch-chatwoot-sidekiq
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_lengthy_secure_hex}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      chatwoot:
        condition: service_started
    restart: unless-stopped
  umkm-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-automation
    command:
      - umkm-automation
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - WA_GATEWAY_URL=http://wa-gateway:8202/api/wa/send
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
    ports:
      - "8203:8203"
    depends_on:
      postgres:
        condition: service_healthy
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  umkm-frontend:
    build:
      context: ./frontend/umkm-web
      dockerfile: Dockerfile
    container_name: wch-umkm-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
volumes:
  pgdata: null
  redisdata: null
  n8n_data: null
  chatwoot_redis_data: null
