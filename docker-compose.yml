services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wch-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wch_core}
    # /docker-entrypoint-initdb.d/ auto-run on first start (idempotent)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-create-n8n-db.sql:ro
    # Internal only - access via PgBouncer
    expose:
      - 5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wch_core}
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: ghcr.io/nzf210/core_project-pgbouncer:latest
    container_name: wch-pgbouncer
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - N8N_DB_NAME=${N8N_DB_NAME:-wch_n8n_db}
    ports:
      - "10433:6432"  # DEV: 1=dev, 0=infra, 433=pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 6432 || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    container_name: wch-redis
    ports:
      - "10631:6379"  # DEV: 1=dev, 0=infra, 631=redis
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api-gateway:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-api-gateway
    volumes:
      - ./uploads:/app/uploads
    command:
      - api-gateway
    environment:
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
      - N8N_HOST=n8n-main
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      auth-service:
        condition: service_started
      ai-gateway:
        condition: service_started
      umkm-accounting:
        condition: service_started
      campaign-api:
        condition: service_started
      billing-service:
        condition: service_started
    restart: unless-stopped
  auth-service:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-auth-service
    volumes:
      - ./uploads:/app/uploads
    command:
      - auth-service
    environment:
      - APP_ENV=production
      - WA_SYSTEM_TENANT_ID=${WA_SYSTEM_TENANT_ID:-system}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-superadmin123}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  ai-gateway:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-ai-gateway
    command:
      - ai-gateway
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL}
      - MINIMAX_MODEL=${MINIMAX_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  umkm-accounting:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-umkm-accounting
    command:
      - umkm-accounting
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
  umkm-business:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-umkm-business
    command:
      - umkm-business
    environment:
      - APP_ENV=production
      - PORT=9005
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  n8n-main:
    image: n8nio/n8n:latest
    container_name: wch-n8n-main
    restart: always
    environment:
      # ── Database Persistence (dedicated N8N database) ────────────────────
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-wch_n8n_db}
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-${DB_USER:-postgres}}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-${DB_PASSWORD:-postgres}}
      # ── Queue Mode (Redis Bull queue, DB 2) ──────────────────────────────
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=2
      # ── Encryption Key (WAJIB di-set untuk production) ────────────────
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # ── Webhook & UI ───────────────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=Asia/Jakarta
      # ── Auth & Security ────────────────────────────────────────────────
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-change_me_in_env}
      # ── Performance ───────────────────────────────────────────────────
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_METRICS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_CONCURRENCY_PRODUCTION_LIMIT:-20}
      # ── Telegram ──────────────────────────────────────────────────────
      - OWNER_TELEGRAM_CHAT_ID=${OWNER_TELEGRAM_CHAT_ID:-}
      # ── Dynamic API Pointers ──────────────────────────────────────────
      - UMKM_API_URL=${UMKM_API_URL:-http://api-gateway:8000/api/umkm}
      - CAMPAIGN_API_URL=${CAMPAIGN_API_URL:-http://api-gateway:8000/api/campaign}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://wa-gateway:8202}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL:-http://ai-gateway:8002}
    entrypoint:
      - /bin/sh
      - /infra/n8n/init.sh
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows
      - ./infra/n8n/init.sh:/infra/n8n/init.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    ports:
      - "13678:5678"  # DEV: 1=dev, 3=tools, 678=n8n
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
  n8n-worker:
    image: n8nio/n8n:latest
    restart: always
    command: worker
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-1}
    environment:
      # ── Database Persistence ──────────────────────────────────────────
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-wch_n8n_db}
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${N8N_DB_PORT:-5432}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-${DB_USER:-postgres}}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-${DB_PASSWORD:-postgres}}
      # ── Queue Mode ──────────────────────────────────────────────────────
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=2
      # ── Encryption Key ────────────────────────────────────────────────
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # ── Performance ───────────────────────────────────────────────────
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=${N8N_WORKER_CONCURRENCY:-10}
      # ── Dynamic API Pointers ──────────────────────────────────────────
      - UMKM_API_URL=${UMKM_API_URL:-http://api-gateway:8000/api/umkm}
      - CAMPAIGN_API_URL=${CAMPAIGN_API_URL:-http://api-gateway:8000/api/campaign}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://wa-gateway:8202}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL:-http://ai-gateway:8002}
      - GENERIC_TIMEZONE=Asia/Jakarta
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-main:
        condition: service_healthy
      redis:
        condition: service_healthy
  umkm-chatbot:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    command:
      - umkm-chatbot
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - N8N_WEBHOOK_URL=${N8N_INTERNAL_URL:-http://n8n-main:5678/}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  campaign-api:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-campaign-api
    command:
      - campaign-api
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
  wa-cloud-api:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-wa-cloud-api
    command:
      - wa-cloud-api
    environment:
      - WA_CLOUD_API_URL=${WA_CLOUD_API_URL:-https://graph.facebook.com}
      - WA_CLOUD_API_VERSION=${WA_CLOUD_API_VERSION:-v22.0}
      - WA_CLOUD_API_PORT=8210
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
  wa-gateway:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    command:
      - wa-gateway
    environment:
      - WA_SYSTEM_TENANT_ID=${WA_SYSTEM_TENANT_ID:-system}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - N8N_WEBHOOK_URL=${N8N_INTERNAL_URL:-http://n8n-main:5678/}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  billing-service:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-billing-service
    command:
      - billing-service
    environment:
      - APP_ENV=production
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - XENDIT_API_KEY=${XENDIT_API_KEY}
      - XENDIT_WEBHOOK_TOKEN=${XENDIT_WEBHOOK_TOKEN}
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
  notification-service:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-notification-service
    command:
      - notification-service
    environment:
      - APP_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  subscription-worker:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-subscription-worker
    command:
      - subscription-worker
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - FREEZE_CHECK_INTERVAL=${FREEZE_CHECK_INTERVAL:-1h}
      - GRACE_PERIOD_HOURS=${GRACE_PERIOD_HOURS:-0}
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
  chatwoot-redis:
    image: redis:7-alpine
    container_name: wch-chatwoot-redis
    command: redis-server --appendonly yes
    volumes:
      - chatwoot_redis_data:/data
    restart: unless-stopped
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: wch-chatwoot
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_lengthy_secure_hex}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
      - RAILS_LOG_TO_STDOUT=true
      - DEFAULT_LOCALE=id
    command: /bin/sh -c "rm -f /app/tmp/pids/server.pid && bundle exec rake db:chatwoot_prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    ports:
      - "13000:3000"  # DEV: 1=dev, 3=tools, 00=chatwoot
    depends_on:
      pgbouncer:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    restart: unless-stopped
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: wch-chatwoot-sidekiq
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_lengthy_secure_hex}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      chatwoot:
        condition: service_started
    restart: unless-stopped
  umkm-automation:
    image: ghcr.io/nzf210/core_project:${IMAGE_TAG:-latest}
    container_name: wch-umkm-automation
    command:
      - umkm-automation
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - WA_GATEWAY_URL=http://wa-gateway:8202/api/wa/send
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa-gateway:
        condition: service_started
    restart: unless-stopped
  umkm-frontend:
    build:
      context: ./frontend/umkm-web
      dockerfile: Dockerfile
    container_name: wch-umkm-frontend
    restart: unless-stopped
    ports:
      - "12001:80"    # DEV: 1=dev, 2=FE, 01=umkm-web
    depends_on:
      - api-gateway
  superadmin-frontend:
    build:
      context: ./frontend/superadmin-web
      dockerfile: Dockerfile
    container_name: wch-superadmin-frontend
    restart: unless-stopped
    ports:
      - "12002:80"    # DEV: 1=dev, 2=FE, 02=superadmin-web
    depends_on:
      - api-gateway

  campaign-frontend:
    build:
      context: ./frontend/campaign-web
      dockerfile: Dockerfile
    container_name: wch-campaign-frontend
    restart: unless-stopped
    ports:
      - "12003:80"    # DEV: 1=dev, 2=FE, 03=campaign-web
    depends_on:
      - api-gateway

  loki:
    image: grafana/loki:2.9.2
    container_name: wch-loki
    ports:
      - "13100:3100"  # DEV: 1=dev, 3=tools, 100=loki
    volumes:
      - ./infra/observability/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml -ingester.wal-dir=/loki/wal
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: wch-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro,rslave
      - ./infra/observability/promtail/local-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.2
    container_name: wch-grafana
    ports:
      - "13001:3000"  # DEV: 1=dev, 3=tools, 01=grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: wch-prometheus
    ports:
      - "13090:9090"  # DEV: 1=dev, 3=tools, 090=prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: wch-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-wch_core}?sslmode=disable
    ports:
      - "127.0.0.1:13187:9187"  # DEV: 1=dev, 3=tools, 187=postgres-exporter
    restart: unless-stopped
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: wch-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:13121:9121"  # DEV: 1=dev, 3=tools, 121=redis-exporter
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  pgdata: null
  redisdata: null
  n8n_data: null
  chatwoot_redis_data: null
  loki_data: null
  grafana_data: null
  prometheus_data: null
