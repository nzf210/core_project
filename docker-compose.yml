version: '3.8'

services:
  # ==========================================
  # Infrastructure
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: wch-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wch_core}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wch-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Core Services
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-api-gateway
    command: ["api-gateway"]
    environment:
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_started
      ai-gateway:
        condition: service_started
      umkm-accounting:
        condition: service_started
      campaign-api:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-auth-service
    command: ["auth-service"]
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-ai-gateway
    command: ["ai-gateway"]
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL}
      - MINIMAX_MODEL=${MINIMAX_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
    ports:
      - "8003:8002"
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================
  # Apps / Products
  # ==========================================

  umkm-accounting:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-accounting
    command: ["umkm-accounting"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    ports:
      - "8201:8201"
    depends_on:
      postgres:
        condition: service_healthy

  umkm-business:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-business
    command: ["umkm-business"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - REDIS_HOST=redis
    ports:
      - "9005:9005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: wch-n8n
    restart: always
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PATH=/api/superadmin/n8n/
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta
      # Database setup using existing postgres
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-wch_core}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-postgres}
      # Security (Basic Auth)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=n8n_secure_admin_password_123
    entrypoint: ["/bin/sh", "/infra/n8n/init.sh"]
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows
      - ./infra/n8n/init.sh:/infra/n8n/init.sh
    depends_on:
      postgres:
        condition: service_healthy

  umkm-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-umkm-chatbot
    command: ["umkm-chatbot"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
    ports:
      - "8203:8203"
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      wa-gateway:
        condition: service_started

  crypto-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-crypto-api
    command: ["crypto-api"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-12345678901234567890123456789012}
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crypto-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-crypto-worker
    command: ["crypto-worker"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-12345678901234567890123456789012}
      - AI_GATEWAY_URL=http://ai-gateway:8002/v1/chat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  campaign-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-campaign-api
    command: ["campaign-api"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy

  wa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wch-wa-gateway
    command: ["wa-gateway"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wch_core}
      - DB_SSLMODE=disable
    ports:
      - "8202:8202"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  n8n_data:
