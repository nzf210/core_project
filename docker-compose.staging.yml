# docker-compose.staging.yml
# Production-ready overrides untuk staging deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

version: '3.8'

services:
  # ============================================================================
  # API Gateway (public facing)
  # ============================================================================
  api-gateway:
    env_file: .env.staging
    ports:
      - "8010:8000"  # Public access via Nginx reverse proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # ============================================================================
  # Backend Services (internal only)
  # ============================================================================
  auth-service:
    env_file: .env.staging
    ports:
      - "127.0.0.1:8001:8001"
