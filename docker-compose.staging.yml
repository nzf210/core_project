# =============================================================================
# WCH Platform — Staging Port Override
#
# Gunakan bersama docker-compose.yml:
#   COMPOSE_PROJECT_NAME=wch-stg docker compose \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Skema port staging (prefix 2):
#   X  Y  Z Z
#   2  0  xx  = infra     (pgbouncer, redis)
#   2  1  xx  = backend   (Go services)
#   2  2  xx  = frontend  (Vue/Nginx)
#   2  3  xx  = tools     (grafana, n8n, loki, prometheus, chatwoot)
#
# Ref lengkap: docs/PORT_REGISTRY.md
# =============================================================================

networks:
  default:
    name: wch-stg-network  # isolated — tidak bercampur dengan prod

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    container_name: wch-stg-postgres
    env_file: .env.staging

  pgbouncer:
    container_name: wch-stg-pgbouncer
    env_file: .env.staging
    environment:
      - PGBOUNCER_MAX_CLIENT_CONN=10000
      - PGBOUNCER_DEFAULT_POOL_SIZE=100
      - PGBOUNCER_POOL_MODE=transaction
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "20433:6432"  # STG: 2=stg, 0=infra, 433=pgbouncer

  redis:
    container_name: wch-stg-redis
    env_file: .env.staging
    ports:
      - "20631:6379"  # STG: 2=stg, 0=infra, 631=redis

  rabbitmq:
    container_name: wch-stg-rabbitmq
    env_file: .env.staging
    ports:
      - "20672:5672"   # STG: 2=stg, 0=infra, 672=rabbitmq AMQP
      - "20673:15672"  # STG: 2=stg, 0=infra, 673=rabbitmq management UI

  worker-autoscaler:
    container_name: wch-stg-worker-autoscaler
    env_file: .env.staging
    environment:
      - COMPOSE_PROJECT_NAME=wch-stg

  # ── Backend Go Services (internal only) ─────────────────────────────────────
  api-gateway:
    container_name: wch-stg-api-gateway
    env_file: .env.staging
    ports:
      - "21000:8000"  # STG: 2=stg, 1=BE, 00=api-gateway (akses testing via Nginx)

  auth-service:
    container_name: wch-stg-auth-service
    env_file: .env.staging

  ai-gateway:
    container_name: wch-stg-ai-gateway
    env_file: .env.staging

  billing-service:
    container_name: wch-stg-billing-service
    env_file: .env.staging

  notification-service:
    container_name: wch-stg-notification-service
    env_file: .env.staging

  subscription-worker:
    container_name: wch-stg-subscription-worker
    env_file: .env.staging

  umkm-accounting:
    container_name: wch-stg-umkm-accounting
    env_file: .env.staging

  umkm-business:
    container_name: wch-stg-umkm-business
    env_file: .env.staging

  umkm-chatbot:
    container_name: wch-stg-umkm-chatbot
    env_file: .env.staging

  umkm-automation:
    container_name: wch-stg-umkm-automation
    env_file: .env.staging

  wa-gateway:
    container_name: wch-stg-wa-gateway
    env_file: .env.staging

  wa-cloud-api:
    container_name: wch-stg-wa-cloud-api
    env_file: .env.staging

  campaign-api:
    container_name: wch-stg-campaign-api
    env_file: .env.staging

  # ── Frontend ────────────────────────────────────────────────────────────────
  umkm-frontend:
    container_name: wch-stg-umkm-frontend
    ports:
      - "22001:80"    # STG: 2=stg, 2=FE, 01=umkm-web

  superadmin-frontend:
    container_name: wch-stg-superadmin-frontend
    ports:
      - "22002:80"    # STG: 2=stg, 2=FE, 02=superadmin-web

  campaign-frontend:
    container_name: wch-stg-campaign-frontend
    ports:
      - "22003:80"    # STG: 2=stg, 2=FE, 03=campaign-web

  # ── Observability & Tools ───────────────────────────────────────────────────
  grafana:
    container_name: wch-stg-grafana
    ports:
      - "23001:3000"  # STG: 2=stg, 3=tools, 01=grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-changeme_staging}

  loki:
    container_name: wch-stg-loki
    ports:
      - "23100:3100"  # STG: 2=stg, 3=tools, 100=loki

  prometheus:
    container_name: wch-stg-prometheus
    ports:
      - "23090:9090"  # STG: 2=stg, 3=tools, 090=prometheus

  n8n-main:
    container_name: wch-stg-n8n-main
    env_file: .env.staging
    ports:
      - "23678:5678"  # STG: 2=stg, 3=tools, 678=n8n

  chatwoot:
    container_name: wch-stg-chatwoot
    ports:
      - "23000:3000"  # STG: 2=stg, 3=tools, 00=chatwoot

  postgres-exporter:
    container_name: wch-stg-postgres-exporter
    ports:
      - "127.0.0.1:23187:9187"  # STG: 2=stg, 3=tools, 187=postgres-exporter

  redis-exporter:
    container_name: wch-stg-redis-exporter
    ports:
      - "127.0.0.1:23121:9121"  # STG: 2=stg, 3=tools, 121=redis-exporter
