# docker-compose.staging.yml
# Staging overrides — jalankan di VPS yang sama dengan production
# Usage: COMPOSE_PROJECT_NAME=wch-stg docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Port schema: staging = prod_port + 10000
#   prod 8000 → stg 18000   (api-gateway, public)
#   prod 8001 → stg 18001   (auth-service)
#   prod 8002 → stg 18002   (ai-gateway)
#   prod 8003 → stg 18003   (billing-service)
#   prod 8005 → stg 18005   (notification-service)
#   prod 8006 → stg 18006   (subscription-worker)
#   prod 8201 → stg 18201   (umkm-accounting)
#   prod 8202 → stg 18202   (wa-gateway)
#   prod 8203 → stg 18203   (umkm-chatbot)
#   prod 8204 → stg 18204   (umkm-automation)
#   prod 8210 → stg 18210   (wa-cloud-api)
#   prod 9001 → stg 19001   (umkm-business)
#   prod 9002 → stg 19002   (campaign-api)
#   prod 3001 → stg 13001   (grafana)
#   prod 9090 → stg 19090   (prometheus)
#   prod 5433 → stg 15433   (postgres)
#   prod 6381 → stg 16381   (redis)

# Isolated network agar container staging tidak bercampur dengan prod
networks:
  default:
    name: wch-stg-network

services:
  # ============================================================================
  # Infrastructure (isolated DB & Redis untuk staging)
  # ============================================================================
  postgres:
    container_name: wch-stg-postgres
    env_file: .env.staging
    ports:
      - "127.0.0.1:15433:5432"

  pgbouncer:
    container_name: wch-stg-pgbouncer
    env_file: .env.staging
    ports:
      - "127.0.0.1:16432:6432"

  redis:
    container_name: wch-stg-redis
    env_file: .env.staging
    ports:
      - "127.0.0.1:16381:6379"

  # ============================================================================
  # API Gateway (public facing)
  # ============================================================================
  api-gateway:
    container_name: wch-stg-api-gateway
    env_file: .env.staging
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # ============================================================================
  # Backend Services (internal only, bound ke 127.0.0.1)
  # ============================================================================
  auth-service:
    container_name: wch-stg-auth-service
    env_file: .env.staging
    ports:
      - "127.0.0.1:18001:8001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  ai-gateway:
    container_name: wch-stg-ai-gateway
    env_file: .env.staging
    ports:
      - "127.0.0.1:18002:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  billing-service:
    container_name: wch-stg-billing-service
    env_file: .env.staging
    ports:
      - "127.0.0.1:18003:8003"
    healthcheck:
