# =============================================================================
# Nginx — Staging HTTP-only (sementara, sebelum certbot)
# Digunakan untuk: nginx -t && systemctl start nginx
# Setelah certbot: hapus file ini, aktifkan nginx-staging.conf
# =============================================================================

server {
    listen 80;
    server_name stg-api.umkmai.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:21000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }
}

server {
    listen 80;
    server_name stg-grf.umkmai.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { proxy_pass http://127.0.0.1:23001; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name stg-n8n.umkmai.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { proxy_pass http://127.0.0.1:23678; proxy_set_header Host $host; }
}

