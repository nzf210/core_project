# =============================================================================
# Nginx — Staging (umkmai.id)
# Install: /etc/nginx/sites-available/wch-staging.conf
# Enable:  ln -s /etc/nginx/sites-available/wch-staging.conf /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d stg-api.umkmai.id -d stg-grf.umkmai.id -d stg-n8n.umkmai.id -d stg-spadmin.umkmai.id -d stg.umkmai.id
#          (Gunakan satu perintah certbot untuk semua domain staging agar satu cert SAN)
# =============================================================================

# API Gateway — Backend Staging
server {
    listen 80;
    server_name stg-api.umkmai.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name stg-api.umkmai.id;

    ssl_certificate     /home/deploy/.certbot/config/live/stg-api.umkmai.id/fullchain.pem;
    ssl_certificate_key /home/deploy/.certbot/config/live/stg-api.umkmai.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:21000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-ID       $http_x_tenant_id;
        proxy_read_timeout 120s;
    }
}

# Grafana — Staging
server {
    listen 80;
    server_name stg-grf.umkmai.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name stg-grf.umkmai.id;

    ssl_certificate     /home/deploy/.certbot/config/live/stg-api.umkmai.id/fullchain.pem;
    ssl_certificate_key /home/deploy/.certbot/config/live/stg-api.umkmai.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:23001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

