# =============================================================================
# Nginx — Production (umkmai.id)
# Install: /etc/nginx/sites-available/wch-prod.conf
# Enable:  ln -s /etc/nginx/sites-available/wch-prod.conf /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d api.umkmai.id -d grf.umkmai.id -d n8n.umkmai.id -d umkmai.id -d spadmin.umkmai.id
# =============================================================================

# API Gateway — Backend Production
server {
    listen 80;
    server_name api.umkmai.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.umkmai.id;

    ssl_certificate     /etc/letsencrypt/live/api.umkmai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.umkmai.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-ID       $http_x_tenant_id;
        proxy_read_timeout 120s;
    }
}

# Grafana — Production
server {
    listen 80;
    server_name grf.umkmai.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name grf.umkmai.id;

    ssl_certificate     /etc/letsencrypt/live/grf.umkmai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grf.umkmai.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for Grafana live streaming
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

