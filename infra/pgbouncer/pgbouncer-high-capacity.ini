# PgBouncer Configuration - High Capacity Mode
# Untuk handle 10K-15K concurrent requests tanpa menguras memory VPS

[databases]
wch_platform = host=postgres port=5432 dbname=wch_platform

[pgbouncer]
# Connection Pooling - Efisiensi tinggi
listen_addr = 0.0.0.0
listen_port = 6432

# AUTH
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# CAPACITY TUNING
# 10000 concurrent client connections → hanya 100 real PostgreSQL connections
max_client_conn = 10000         # Target: 100K concurrent requests
default_pool_size = 100         # Per database
min_pool_size = 10              # Warm pool
reserve_pool_size = 50          # Emergency reserve
reserve_pool_timeout = 3        # seconds

# POOL MODE
# transaction = paling efisien untuk read-heavy workload
# connection discard setelah transaction selesai
pool_mode = transaction

# TIMEOUTS
server_idle_timeout = 30        # Agresif: lepas koneksi idle lebih cepat
server_lifetime = 3600          # 1 jam
server_connect_timeout = 15
query_timeout = 30              # Kill queries > 30s
query_wait_timeout = 120        # Max wait in queue

# LOGGING
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60               # Stats update interval

# ADMIN
admin_users = wch_admin
