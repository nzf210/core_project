[databases]
; Syntax: dbname = host=localhost port=5432 dbname=wch_platform
wch_platform = host=postgres port=5432 dbname=wch_platform
wch_n8n = host=postgres port=5432 dbname=wch_n8n

[pgbouncer]
; Listen address and port
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode (transaction = best for OLTP, session = for persistent connections)
pool_mode = transaction

; Connection limits
; Max connections from apps
max_client_conn = 100
; Connections per database to PostgreSQL
default_pool_size = 25
; Always keep 5 connections ready
min_pool_size = 5
; Emergency pool
reserve_pool_size = 5
reserve_pool_timeout = 3

; Server connection settings
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
; Close connection after 1 hour
server_lifetime = 3600
; Close idle connection after 10 min
server_idle_timeout = 600

; DNS lookup
server_round_robin = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

; Stats
stats_period = 60

; Admin console
admin_users = wch_admin
