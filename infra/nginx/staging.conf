# =============================================================================
# WCH Platform — Nginx Staging Reverse Proxy Config
# File ini di-copy ke /etc/nginx/sites-available/wch-staging di VPS
#
# Traffic flow:
#   Cloudflare Tunnel → cloudflared → Nginx (port 80) → Docker containers
#
# Install:
#   sudo cp infra/nginx/staging.conf /etc/nginx/sites-available/wch-staging
#   sudo ln -s /etc/nginx/sites-available/wch-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream pools ─────────────────────────────────────────────────────────
upstream api_gateway {
    server 127.0.0.1:21000;
    keepalive 32;
}

upstream umkm_frontend {
    server 127.0.0.1:22001;
    keepalive 16;
}

upstream superadmin_frontend {
    server 127.0.0.1:22002;
    keepalive 16;
}

upstream campaign_frontend {
    server 127.0.0.1:22003;
    keepalive 16;
}

upstream grafana {
    server 127.0.0.1:23001;
    keepalive 8;
}

upstream n8n {
    server 127.0.0.1:23678;
    keepalive 8;
}

# ── stg-api.umkmai.id — API Gateway ───────────────────────────────────────
server {
    listen 80;
    server_name stg-api.umkmai.id;

    # Real IP dari Cloudflare Tunnel (traffic datang dari loopback)
    real_ip_header   CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Timeout lebih panjang untuk LLM calls via ai-gateway
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# ── stg-app.umkmai.id — UMKM Frontend ─────────────────────────────────────
server {
    listen 80;
    server_name stg-app.umkmai.id;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://umkm_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

