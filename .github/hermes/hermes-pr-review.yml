name: hermes-pr-review
description: Auto AI PR review — correctness, security, multi-tenant compliance, dan Go best practices

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@6ed116d4301b0a7d5e1602c8477e3a4e24fb3f9c
        with:
          go-version: '1.22'
          cache: true

      - name: Get PR info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title --jq '.title')" >> $GITHUB_ENV
          echo "PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')" >> $GITHUB_ENV
          echo "PR_BASE=$(gh pr view ${{ github.event.pull_request.number }} --json base --jq '.base.ref')" >> $GITHUB_ENV

      - name: Run Go review
        run: |
          echo "### AI Code Review Report" > review_comment.md
          echo "**Reviewer:** Hermes AI Agent" >> review_comment.md
          echo "" >> review_comment.md

          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ env.PR_BASE }}...HEAD)
          echo "**Changed files:**" >> review_comment.md
          echo '```' >> review_comment.md
          echo "$CHANGED_FILES" >> review_comment.md
          echo '```' >> review_comment.md
          echo "" >> review_comment.md

          # Run go vet on changed files
          echo "### Go Vet" >> review_comment.md
          if go vet ./... 2>&1 | tee vet_output.txt; then
            echo "✅ `go vet` passed" >> review_comment.md
          else
            echo "⚠️ Issues found:" >> review_comment.md
            echo '```' >> review_comment.md
            cat vet_output.txt >> review_comment.md
            echo '```' >> review_comment.md
          fi
          echo "" >> review_comment.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file review_comment.md

  multi-tenant-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Multi-tenant compliance check
        run: |
          echo "### Multi-Tenant Compliance Check" > mt_check.md

          # Check that all handlers read X-Tenant-ID
          echo "**Checking handlers for X-Tenant-ID header usage:**" >> mt_check.md
          HANDLERS_MISSING=$(grep -rL 'X-Tenant-ID' apps/*/main.go apps/*/api/main.go 2>/dev/null | head -20 || true)
          if [ -z "$HANDLERS_MISSING" ]; then
            echo "✅ All main.go handlers appear to use X-Tenant-ID" >> mt_check.md
          else
            echo "⚠️ Potential handlers missing X-Tenant-ID:" >> mt_check.md
            echo '```' >> mt_check.md
            echo "$HANDLERS_MISSING" >> mt_check.md
            echo '```' >> mt_check.md
          fi

          echo "" >> mt_check.md

          # Check that SQL queries reference tenant_id
          echo "**Checking SQL queries for tenant_id:**" >> mt_check.md
          QUERIES_MISSING=$(grep -rn 'Query\|Exec\|QueryRow' --include="*.go" | \
            grep -v '_test.go' | \
            grep '\$1\|WHERE' | \
            grep -v 'tenant_id' | head -20 || true)
          if [ -z "$QUERIES_MISSING" ]; then
            echo "✅ All parameterized queries appear tenant-filtered" >> mt_check.md
          else
            echo "⚠️ Queries that may need tenant_id review:" >> mt_check.md
            echo '```' >> mt_check.md
            echo "$QUERIES_MISSING" >> mt_check.md
            echo '```' >> mt_check.md
          fi

          echo "" >> mt_check.md
          echo "_Note: This is a heuristic check. Integration tests are the source of truth._" >> mt_check.md

      - name: Post multi-tenant comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file mt_check.md
