name: Deploy WCH Platform

# =============================================================================
# TAG CONVENTION:
#   stg-be-v*       → Deploy all Go backend services to VPS staging
#   prod-be-v*      → Deploy all Go backend services to VPS production
#   stg-umkm-v*     → Deploy umkm-web to Cloudflare Pages (staging)
#   prod-umkm-v*    → Deploy umkm-web to Cloudflare Pages (production)
#   stg-admin-v*    → Deploy superadmin-web to Cloudflare Pages (staging)
#   prod-admin-v*   → Deploy superadmin-web to Cloudflare Pages (production)
#   stg-campaign-v* → Deploy campaign-web to Cloudflare Pages (staging)
#   prod-campaign-v* → Deploy campaign-web to Cloudflare Pages (production)
# =============================================================================

on:
  push:
    tags:
      - 'stg-be-v*'
      - 'prod-be-v*'
      - 'stg-umkm-v*'
      - 'prod-umkm-v*'
      - 'stg-admin-v*'
      - 'prod-admin-v*'
      - 'stg-campaign-v*'
      - 'prod-campaign-v*'

jobs:
  # ============================================================================
  # Detect which component and environment from tag prefix
  # ============================================================================
  set-env:
    name: Detect Target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      cf_branch: ${{ steps.detect.outputs.cf_branch }}
      compose_override: ${{ steps.detect.outputs.compose_override }}
      compose_project: ${{ steps.detect.outputs.compose_project }}
      api_gateway_port: ${{ steps.detect.outputs.api_gateway_port }}
      auth_service_port: ${{ steps.detect.outputs.auth_service_port }}
      deploy_be: ${{ steps.detect.outputs.deploy_be }}
      deploy_umkm: ${{ steps.detect.outputs.deploy_umkm }}
      deploy_admin: ${{ steps.detect.outputs.deploy_admin }}
      deploy_campaign: ${{ steps.detect.outputs.deploy_campaign }}
      cf_project_umkm: ${{ steps.detect.outputs.cf_project_umkm }}
      cf_project_admin: ${{ steps.detect.outputs.cf_project_admin }}
      cf_project_campaign: ${{ steps.detect.outputs.cf_project_campaign }}
      vps_ssh_port: ${{ steps.detect.outputs.vps_ssh_port }}
    steps:
      - name: Detect from tag
        id: detect
        run: |
          TAG="${{ github.ref_name }}"

          # Environment
          if [[ "$TAG" == prod-* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "cf_branch=main" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.prod.yml" >> $GITHUB_OUTPUT
            echo "compose_project=wch-prod" >> $GITHUB_OUTPUT
            echo "api_gateway_port=8000" >> $GITHUB_OUTPUT
            echo "auth_service_port=8001" >> $GITHUB_OUTPUT
            echo "cf_project_umkm=wch-umkm-web" >> $GITHUB_OUTPUT
            echo "cf_project_admin=wch-superadmin-web" >> $GITHUB_OUTPUT
            echo "cf_project_campaign=wch-campaign-web" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "cf_branch=main" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "compose_project=wch-stg" >> $GITHUB_OUTPUT
            echo "api_gateway_port=18000" >> $GITHUB_OUTPUT
            echo "auth_service_port=18001" >> $GITHUB_OUTPUT
            echo "cf_project_umkm=wch-umkm-web-stg" >> $GITHUB_OUTPUT
            echo "cf_project_admin=wch-superadmin-web-stg" >> $GITHUB_OUTPUT
            echo "cf_project_campaign=wch-campaign-web-stg" >> $GITHUB_OUTPUT
          fi

          # VPS SSH port (default 3209, override via vars.VPS_SSH_PORT)
          echo "vps_ssh_port=${{ vars.VPS_SSH_PORT || '3209' }}" >> $GITHUB_OUTPUT

          # Which component to deploy
          if [[ "$TAG" == *-be-v* ]]; then
            echo "deploy_be=true"       >> $GITHUB_OUTPUT
            echo "deploy_umkm=false"    >> $GITHUB_OUTPUT
            echo "deploy_admin=false"   >> $GITHUB_OUTPUT
            echo "deploy_campaign=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-umkm-v* ]]; then
            echo "deploy_be=false"       >> $GITHUB_OUTPUT
            echo "deploy_umkm=true"      >> $GITHUB_OUTPUT
            echo "deploy_admin=false"    >> $GITHUB_OUTPUT
            echo "deploy_campaign=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-admin-v* ]]; then
            echo "deploy_be=false"       >> $GITHUB_OUTPUT
            echo "deploy_umkm=false"     >> $GITHUB_OUTPUT
            echo "deploy_admin=true"     >> $GITHUB_OUTPUT
            echo "deploy_campaign=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-campaign-v* ]]; then
            echo "deploy_be=false"       >> $GITHUB_OUTPUT
            echo "deploy_umkm=false"     >> $GITHUB_OUTPUT
            echo "deploy_admin=false"    >> $GITHUB_OUTPUT
            echo "deploy_campaign=true"  >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB: Test Go Backend (only runs on *-be-v* tags)
  # ============================================================================
  test-backend:
    name: Test & Build Backend
    needs: set-env
    if: needs.set-env.outputs.deploy_be == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: go test ./... -short -v

      - name: Build Go Services (compile check)
        run: |
          go build -o /dev/null ./services/...
          go build -o /dev/null ./apps/...

  # ============================================================================
  # JOB: Build Docker Image & Push to GHCR (only runs on *-be-v* tags)
  # ============================================================================
  build-and-push:
    name: Build & Push Image → GHCR
    needs: [set-env, test-backend]
    if: needs.set-env.outputs.deploy_be == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/nzf210/core_project
          tags: |
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pgbouncer image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./infra/pgbouncer
          push: true
          tags: ghcr.io/nzf210/core_project-pgbouncer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB: Deploy Backend to VPS (only runs on *-be-v* tags)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend → VPS (${{ needs.set-env.outputs.environment }})
    needs: [set-env, build-and-push]
    if: needs.set-env.outputs.deploy_be == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - name: Checkout Code (for compose files)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ needs.set-env.outputs.vps_ssh_port }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,${{ needs.set-env.outputs.compose_override }}"
          target: ${{ needs.set-env.outputs.environment == 'production' && '/opt/wch-production' || '/opt/wch-staging' }}
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ needs.set-env.outputs.vps_ssh_port }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR=${{ needs.set-env.outputs.environment == 'production' && '/opt/wch-production' || '/opt/wch-staging' }}
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"
            OVERRIDE_FILE="$DEPLOY_DIR/${{ needs.set-env.outputs.compose_override }}"

            cd "$DEPLOY_DIR"

            # Ensure .env points to the correct environment file
            ENV_FILE=".env.${{ needs.set-env.outputs.environment == 'production' && 'production' || 'staging' }}"
            ln -sf "$ENV_FILE" .env

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.VPS_USERNAME }} --password-stdin

            echo "=== Pulling image ghcr.io/nzf210/core_project:${IMAGE_TAG} ==="
            IMAGE_TAG="$IMAGE_TAG" docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE_FILE" pull \
              api-gateway auth-service ai-gateway billing-service \
              notification-service subscription-worker \
              umkm-accounting umkm-business umkm-chatbot umkm-automation \
              wa-gateway wa-cloud-api campaign-api

            echo "=== Pulling pgbouncer image ==="
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE_FILE" pull pgbouncer

            echo "=== Restarting Go services ==="
            COMPOSE_PROJECT_NAME=${{ needs.set-env.outputs.compose_project }} \
            IMAGE_TAG="$IMAGE_TAG" docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE_FILE" up -d \
              pgbouncer \
              api-gateway auth-service ai-gateway billing-service \
              notification-service subscription-worker \
              umkm-accounting umkm-business umkm-chatbot umkm-automation \
              wa-gateway wa-cloud-api campaign-api

            echo "=== Cleaning up old images ==="
            docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ needs.set-env.outputs.vps_ssh_port }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DEPLOY_DIR=${{ needs.set-env.outputs.environment == 'production' && '/opt/wch-production' || '/opt/wch-staging' }}

            echo "=== Service Status ==="
            COMPOSE_PROJECT_NAME=${{ needs.set-env.outputs.compose_project }} \
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}" \
            docker compose -f "$DEPLOY_DIR/docker-compose.yml" \
              -f "$DEPLOY_DIR/${{ needs.set-env.outputs.compose_override }}" ps

            echo "=== Waiting for API Gateway ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:${{ needs.set-env.outputs.api_gateway_port }}/healthz; then
                echo "API Gateway healthy"
                break
              fi
              echo "Attempt $i/12 failed, retrying in 10s..."
              sleep 10
            done
            curl -f http://localhost:${{ needs.set-env.outputs.api_gateway_port }}/healthz || exit 1

            echo "=== Waiting for Auth Service ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:${{ needs.set-env.outputs.auth_service_port }}/health; then
                echo "Auth Service healthy"
                break
              fi
              echo "Attempt $i/12 failed, retrying in 10s..."
              sleep 10
            done
            curl -f http://localhost:${{ needs.set-env.outputs.auth_service_port }}/health || exit 1

            echo "=== Deployed: ${{ github.ref_name }} → ${{ needs.set-env.outputs.environment }} ==="

      - name: Print Logs on Failure
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ needs.set-env.outputs.vps_ssh_port }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DEPLOY_DIR=${{ needs.set-env.outputs.environment == 'production' && '/opt/wch-production' || '/opt/wch-staging' }}
            PROJECT=${{ needs.set-env.outputs.compose_project }}

            echo "=== ENV KEYS SET (values hidden) ==="
            grep -v '^\s*#' "$DEPLOY_DIR/.env.${{ needs.set-env.outputs.environment == 'production' && 'production' || 'staging' }}" | grep '=' | sed 's/=.*/=***/' || true

            echo "=== CONTAINER STATUS ==="
            docker ps -a --filter "name=${PROJECT}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "=== LOGS: CRASHED/RESTARTING SERVICES ==="
            for svc in auth-service campaign-api subscription-worker umkm-business umkm-automation; do
              cname="${PROJECT}-${svc}"
              status=$(docker inspect --format='{{.State.Status}}' "$cname" 2>/dev/null || echo "not found")
              if [[ "$status" == "restarting" || "$status" == "exited" ]]; then
                echo "--- $cname ($status) ---"
                docker logs "$cname" --tail=30 2>&1
              fi
            done

            echo "=== LOGS: API GATEWAY ==="
            docker logs "${PROJECT}-api-gateway" --tail=30 2>&1 || true

  # ============================================================================
  # JOB: Deploy umkm-web to Cloudflare Workers (only runs on *-umkm-v* tags)
  # ============================================================================
  deploy-umkm-web:
    name: Deploy umkm-web → CF Workers (${{ needs.set-env.outputs.environment }})
    needs: set-env
    if: needs.set-env.outputs.deploy_umkm == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    defaults:
      run:
        working-directory: frontend/umkm-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/umkm-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Generate wrangler.jsonc
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "name": "${{ needs.set-env.outputs.cf_project_umkm }}",
            "compatibility_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: frontend/umkm-web
          command: deploy

  # ============================================================================
  # JOB: Deploy superadmin-web to Cloudflare Workers (only runs on *-admin-v* tags)
  # ============================================================================
  deploy-superadmin-web:
    name: Deploy superadmin-web → CF Workers (${{ needs.set-env.outputs.environment }})
    needs: set-env
    if: needs.set-env.outputs.deploy_admin == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    defaults:
      run:
        working-directory: frontend/superadmin-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/superadmin-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GRAFANA_URL: ${{ secrets.VITE_GRAFANA_URL }}
        run: npm run build

      - name: Generate wrangler.jsonc
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "name": "${{ needs.set-env.outputs.cf_project_admin }}",
            "compatibility_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: frontend/superadmin-web
          command: deploy

  # ============================================================================
  # JOB: Deploy campaign-web to Cloudflare Workers (only runs on *-campaign-v* tags)
  # ============================================================================
  deploy-campaign-web:
    name: Deploy campaign-web → CF Workers (${{ needs.set-env.outputs.environment }})
    needs: set-env
    if: needs.set-env.outputs.deploy_campaign == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    defaults:
      run:
        working-directory: frontend/campaign-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/campaign-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Generate wrangler.jsonc
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "name": "${{ needs.set-env.outputs.cf_project_campaign }}",
            "compatibility_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: frontend/campaign-web
          command: deploy
