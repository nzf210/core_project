name: Deploy Superadmin to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/superadmin-web/**'
      - '.github/workflows/deploy-superadmin.yml'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/superadmin-web/package-lock.json'

      - name: Install dependencies
        working-directory: frontend/superadmin-web
        run: npm ci

      - name: Build for staging
        working-directory: frontend/superadmin-web
        env:
          VITE_API_URL: https://stg-api.umkmai.id
          VITE_GRAFANA_URL: https://stg-grf.umkmai.id
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wch-superadmin
          directory: frontend/superadmin-web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
