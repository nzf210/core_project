name: analysis-code-understanding
description: Memahami struktur kode, mapping dependencies, dan relasi antar komponen

trigger:
  - "/model analysis"
  - "understand this"
  - "map dependencies"
  - "where is X defined"

input:
  required:
    - target
  optional:
    - depth
    - focus_area

steps:
  - id: locate
    agent: Explore
    prompt: |
      Target: {target}
      Focus area: {focus_area}
      Depth: {depth}

      Find all files related to "{target}".
      For each file found, report:
      1. Full file path
      2. What it contains (summary in 1-2 sentences)
      3. What depends on it (incoming references)
      4. What it depends on (outgoing references)

      Use glob + grep to search thoroughly. Report file paths + line numbers for key symbols.
    schema:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              summary: { type: string }
              incoming: { type: array, items: { type: string } }
              outgoing: { type: array, items: { type: string } }
            required: [path, summary]

  - id: map-imports
    agent: Explore
    prompt: |
      Using the findings from the previous step, map the full import/dependency graph
      for "{target}". Show which packages import which other packages.
      Identify any circular dependencies.

  - id: summarize
    agent: GeneralPurpose
    prompt: |
      Based on the analysis, give a concise architectural summary:
      - What is "{target}" responsible for?
      - What are its public interfaces (HTTP handlers, exported functions)?
      - Where does it fit in the broader platform architecture?
      - What are the key design patterns used?

      Format as a short markdown report.
    model: sonnet

output:
  format: markdown
  deliverable: |
    ## Code Understanding Report: {target}

    ### Summary
    ...

    ### File Map
    | File | Responsibility |
    |:-----|:---------------|
    | ... | ... |

    ### Dependency Graph
    ...

    ### Key Interfaces
    ...