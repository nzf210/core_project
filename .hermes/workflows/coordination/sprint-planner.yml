name: coordination-sprint-planner
description: Weekly sprint planning — owner gives direction, AI generates backlog dan breakdown

trigger:
  - "plan sprint"
  - "sprint planning"
  - "/goal"

input:
  required:
    - sprint_goal
    - num_weeks
  optional:
    - existing_backlog

steps:
  - id: gather-context
    agent: Explore
    prompt: |
      Gather context for sprint planning:

      1. Read docs/FEATURE_MAP.md and docs/master_plan.md for current roadmap
      2. Check git log --oneline -20 for recent completions
      3. Read HERMES.md for current framework conventions
      4. Check if there are any pending migrations in shared/migrations/

      Report: recent completions, pending items, known technical debt.

  - id: generate-backlog
    agent: GeneralPurpose
    model: sonnet
    prompt: |
      Sprint goal: {sprint_goal}
      Duration: {num_weeks} week(s)
      Existing backlog: {existing_backlog}

      Based on the goal and context gathered, generate a sprint backlog:

      1. List 3-5 main deliverables (user-facing features or infrastructure)
      2. For each deliverable, list 2-5 concrete tasks
      3. Estimate complexity (S/M/L) for each task
      4. Identify any dependencies between tasks
      5. Flag any items that require database migration or API breaking changes

      Format as a markdown table:
      | # | Task | Type | Domain | Complexity | Depends on |
      |---|------|------|--------|------------|-------------|

  - id: breakdown-tasks
    agent: GeneralPurpose
    prompt: |
      For each HIGH or CRITICAL priority task in the backlog, create a Hermes task breakdown.

      Use the standard task breakdown format from HERMES.md:
      - TASK title
      - TIPE: feature/bugfix/refactor/research/infra
      - PRIORITAS: critical/high/medium/low
      - DOMAIN: umkm/campaign/platform/infra
      - STEP 1: Analysis
      - STEP 2: Design (with 2-3 options, choose one)
      - STEP 3: Implementation (file list, order)
      - STEP 4: Verification (test criteria)
      - STEP 5: Documentation (files to update)

output:
  format: markdown
  deliverable: |
    ## Sprint Plan — {sprint_goal}

    Duration: {num_weeks} week(s)

    ### Deliverables
    ...

    ### Sprint Backlog
    | # | Task | Type | Domain | Complexity | Depends on |
    |---|------|------|--------|------------|-------------|

    ### Task Breakdowns
    {standard Hermes breakdowns}

    ### Definition of Done
    - [ ] All critical/high tasks complete
    - [ ] CI passes (vet + fmt + test + build)
    - [ ] Documentation updated
    - [ ] Owner sign-off