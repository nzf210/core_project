name: development-new-feature
description: Full lifecycle: analyze existing code → design approach → implement → test → update docs

trigger:
  - "/new-feature"
  - "add feature"
  - "implement"
  - "build feature"

input:
  required:
    - feature_description
    - domain
  optional:
    - acceptance_criteria
    - priority

steps:
  - id: analyze-existing
    agent: Explore
    prompt: |
      Feature: {feature_description}
      Domain: {domain}

      1. List the existing files in `apps/{domain}/` and `services/` that are most relevant.
      2. Read each relevant file and summarize what it does.
      3. Identify the appropriate directory to add new code.
      4. Check existing patterns: naming conventions, struct definitions, handler patterns.

      Report: file list, summary, and recommended structure for the new feature.

  - id: design-approach
    agent: Plan
    prompt: |
      Feature: {feature_description}
      Domain: {domain}
      Acceptance criteria: {acceptance_criteria}

      Using the codebase patterns found, design the implementation approach:
      1. What files need to be created/modified?
      2. What is the code structure (package layout, struct definitions)?
      3. What is the HTTP API surface (endpoints, request/response)?
      4. What database tables or schema changes are needed?
      5. What are the key functions and their signatures?

      Follow the Go conventions in CLAUDE.md:
      - Use `net/http` (no Gin/Echo/Fiber)
      - Use `github.com/jackc/pgx/v5`
      - Use `github.com/golang-jwt/j4/jwt/v5`
      - Multi-tenant: every table has tenant_id, every query filters by tenant_id
      - Structured logging with `log/slog`
      - Money in int64 (sen), UUID for IDs

      Output a numbered implementation plan.

  - id: implement
    agent: GeneralPurpose
    prompt: |
      You are implementing the feature described below following the plan you created.

      Feature: {feature_description}
      Domain: {domain}
      Acceptance criteria: {acceptance_criteria}

      IMPLEMENTATION STEPS:
      1. Create new files or modify existing files as planned
      2. Follow the exact patterns from CLAUDE.md (net/http, pgx/v5, multi-tenant, etc.)
      3. Write unit tests for any new business logic (use table-driven tests)
      4. If database changes are needed, create migration files in `shared/migrations/`

      CRITICAL RULES:
      - NEVER use float64 for money — use int64 (sen)
      - NEVER concatenate strings in SQL queries — use parameterized queries
      - NEVER hardcode secrets — use config.LoadConfig()
      - Every database table MUST have tenant_id
      - Every handler MUST read X-Tenant-ID header

      After implementation, run:
        go build ./... && go vet ./... && go test ./...

      Report what was created/modified and the test results.

  - id: document
    agent: GeneralPurpose
    prompt: |
      Update documentation for the new feature:

      1. Update FEATURE_MAP.md with the new feature
      2. If there is a new API endpoint, add it to the port registry in CLAUDE.md
      3. If there is a new migration, add it to MIGRATION_REGISTRY.md
      4. Add a summary of the implementation to the feature description

      Only update the relevant sections, don't rewrite entire files.

output:
  format: markdown
  deliverable: |
    ## Feature Implementation Report: {feature_description}

    ### Files Created/Modified
    ...

    ### Database Changes
    ...

    ### API Endpoints
    ...

    ### Test Results
    ...

    ### Documentation Updated
    ...